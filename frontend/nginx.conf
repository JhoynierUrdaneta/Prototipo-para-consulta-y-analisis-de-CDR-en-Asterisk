server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API -> backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Assets con hash en el nombre: se pueden cachear indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Los bundles de Angular llevan hash en la raíz (main-XXXX.js, chunk-XXXX.js).
    location ~* \.(js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback. index.html y las rutas NUNCA se cachean, para que cada
    # nuevo despliegue se cargue de inmediato (sin hard-refresh manual).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
